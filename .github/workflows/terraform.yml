name: Terraform Checks

on:
  pull_request:
    paths:
      - '**/*.tf'
      - '**/*.tfvars'
      - '.github/workflows/terraform.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  terraform:
    name: Terraform fmt / validate / plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.5"
      - name: Find Terraform directories
        id: dirs
        run: |
          dirs=$(find . -name '*.tf' -printf '%h\n' | sort -u)
          echo "dirs<<DIREOF" >> "$GITHUB_OUTPUT"
          echo "$dirs" >> "$GITHUB_OUTPUT"
          echo "DIREOF" >> "$GITHUB_OUTPUT"
      - name: Terraform Format (auto-fix)
        run: terraform fmt -recursive
      - name: Commit formatting fixes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: terraform fmt (auto)"
            git push origin HEAD:${{ github.head_ref }}
          else
            echo "Already formatted."
          fi
      - name: Terraform Init & Validate
        run: |
          status=0
          while IFS= read -r dir; do
            echo "::group::$dir"
            cd "$dir"
            terraform init -backend=false -input=false
            terraform validate || status=$?
            cd "$GITHUB_WORKSPACE"
            echo "::endgroup::"
          done <<< "${{ steps.dirs.outputs.dirs }}"
          exit $status
